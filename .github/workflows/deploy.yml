name: Deploy to Hostinger VPS — Automated SSH Pipeline
# Triggered deployment after configuring repository secrets

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            if [ ! -d "/root/pace_bot/.git" ]; then
              mkdir -p /root/pace_bot
              git clone https://github.com/moizkhan-08/PACERESTAURENTBOT.git /root/pace_bot
            fi
            cd /root/pace_bot
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              cp .env.example .env
            fi
            docker compose up -d --build
            docker image prune -f
