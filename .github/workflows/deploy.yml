name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            
            # Hostinger Docker Manager tracks projects inside /docker/
            PROJECT_DIR="/docker/pace_bot"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📂 Creating directory $PROJECT_DIR for Hostinger Docker Manager"
              mkdir -p /docker/pace_bot
              git clone https://github.com/moizkhan-08/PACERESTAURENTBOT.git /docker/pace_bot
            fi
            
            cd "$PROJECT_DIR"
            echo "📂 Working in $PROJECT_DIR"
            
            # Mark directory as safe for git
            git config --global --add safe.directory "$PROJECT_DIR"
            
            git pull origin main
            echo "✅ Code pulled"
            
            chmod +x deploy.sh
            ./deploy.sh
            echo "🚀 Deployed successfully"
